name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: |
          node ./dist/cli/index.js --version
          node ./dist/cli/index.js --help
      - name: Benchmark guardrails suites (deterministic, offline)
        run: |
          node ./dist/cli/index.js benchmark validate privacy-guardrails
          node ./dist/cli/index.js benchmark validate release-guardrails
          node ./dist/cli/index.js benchmark run privacy-guardrails --json > /tmp/pg.json
          node ./dist/cli/index.js benchmark run release-guardrails --json > /tmp/rg.json
          node -e "
            const fs = require('fs');
            for (const [name, file] of [['privacy-guardrails', '/tmp/pg.json'], ['release-guardrails', '/tmp/rg.json']]) {
              const run = JSON.parse(fs.readFileSync(file, 'utf8')).run;
              const bad = run.summary.failed + run.summary.errors;
              if (bad > 0 || run.aggregate.score < 100) {
                console.error("${name} regressed: failed=${run.summary.failed} errors=${run.summary.errors} score=${run.aggregate.score}");
                process.exit(1);
              }
              console.log("${name}: ${run.summary.cases}/${run.summary.cases} cases, score ${run.aggregate.score}");
            }
          "

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site (docs + marketplace island + assembly)
        run: npm run site:build
      - name: Artifact sanity checks
        run: |
          test -f site/index.html
          test -f site/marketplace.html
          test -f site/404.html
          test -f site/app/index.html
          test -f site/guide/what-is-proagents.html
          test -f site/.marketplace/catalog.json
          grep -q "pa-mp-head" site/marketplace.html || (echo 'marketplace page header missing' && exit 1)
          grep -rq "pa-app" site/assets/ || (echo 'island code missing from the bundle' && exit 1)
