name: Profile proposal
description: Publish a Professional Agent Profile to the registry (security-engineer, sre, …)
title: "[profile]: "
labels: ["profile-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a profession! Paste your **profile manifest JSON**
        inside the block below — the same JSON shape as `registry/profiles/security-engineer/profile.json`.
        The deterministic validator runs automatically on this issue (and on every edit),
        and a maintainer publishes with `/publish` after design review.
  - type: input
    id: slug
    attributes:
      label: Profile slug
      description: Must be kebab-case and match profile.slug in the JSON.
      placeholder: security-engineer
    validations:
      required: true
  - type: textarea
    id: profile-json
    attributes:
      label: Profile manifest (PROFILE-JSON block)
      description: Wrap the JSON in the PROFILE-JSON markers exactly as shown — the workflow extracts this block.
      value: "<!-- PROFILE-JSON-BEGIN -->\n```json\n{\n  \"version\": \"1\",\n  \"profile\": { \"name\": \"…\", \"slug\": \"…\", \"version\": \"1.0.0\" },\n  \"identity\": { \"title\": \"…\" },\n  \"expertise\": [\"…\"],\n  \"tools\": { \"required\": [\"filesystem\", \"shell\", \"git\"] },\n  \"verification\": { \"required\": [\"tests\"] }\n}\n```\n<!-- PROFILE-JSON-END -->"
    validations:
      required: true
  - type: checkboxes
    id: attestation
    attributes:
      label: Attestation
      options:
        - label: The rules are normative and I have the right to publish them (MIT)
          required: true
        - label: Verification requirements are executable by a coding agent with the declared tools
          required: true
