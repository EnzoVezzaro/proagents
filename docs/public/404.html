<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fd" />
    <title>Page not found — ProAgents</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --paper: #f7f8fd;
        --ink: #0d1128;
        --muted: #5b6480;
        --line: rgba(13, 17, 40, 0.14);
        --accent: #0e4bec;
        --accent-strong: #0b3fc9;
        --cyan: #0cced4;
        --ramp: linear-gradient(90deg, #5d2de2 0%, #0e4bec 38%, #13a6e0 72%, #0cced4 100%);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        max-width: 560px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 40px 44px;
        background: #ffffff;
      }
      h1 { font-size: 28px; margin: 22px 0 10px; letter-spacing: -0.02em; }
      p { margin: 0 0 8px; color: var(--muted); line-height: 1.55; }
      p code { color: var(--accent-strong); font-size: 0.92em; }
      .actions { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
      .btn {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
      .btn:hover { background: var(--accent-strong); }
      .btn.ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
        font-weight: 500;
      }
      .btn.ghost:hover { border-color: var(--accent); color: var(--accent-strong); }
      .ramp { height: 3px; background: var(--ramp); border-radius: 2px; margin-top: 30px; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (max-width: 560px) { main { padding: 28px 24px; } }
    </style>
    <script>
      (function () {
        // Old /proagents/docs/… URLs (the pre-merge docs location, including
        // the project-path Pages host) recover into the merged site — every
        // page name still exists at the root.
        var m = location.pathname.match(/^\/(?:proagents\/)?docs\/(.*)$/);
        if (m) location.replace("/" + m[1]);
      })();
    </script>
  </head>
  <body>
    <main>
      <img src="/logo-dark.png" alt="ProAgents" width="132" height="59" />
      <h1>Page not found</h1>
      <p>Old <code>/proagents/docs/…</code> links redirect into the merged site automatically; everything else was moved or never existed.</p>
      <div class="actions">
        <a class="btn" href="/studio">Open the Studio</a>
        <a class="btn ghost" href="/guide/getting-started">Read the docs</a>
      </div>
      <div class="ramp" role="presentation"></div>
    </main>
  </body>
</html>
